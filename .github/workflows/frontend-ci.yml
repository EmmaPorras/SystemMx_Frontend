name: Frontend CI & Build Check

on:
  push:
    branches:
      - main
      - deploy-render
      - prep-entrega-final
      - development
  pull_request:
    branches:
      - main
      - deploy-render
      - development
  workflow_dispatch:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npx eslint .

      - name: Build frontend
        run: npm run build

      - name: Run automated tests
        run: npm test -- --run

  deploy-render:
    name: Deploy frontend to Render
    needs: lint-build-test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/development' &&
      vars.RENDER_FRONTEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Request deployment of the tested commit
        shell: bash
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          : "${RENDER_DEPLOY_HOOK:?Falta el secreto RENDER_DEPLOY_HOOK_FRONTEND}"
          curl --fail --silent --max-time 30 --get \
            --data-urlencode "ref=${GITHUB_SHA}" \
            --output /dev/null \
            "$RENDER_DEPLOY_HOOK" || {
              echo "::error::Render no aceptó la solicitud de despliegue."
              exit 1
            }
          printf 'Render recibió la solicitud para el commit `%s`.\n' \
            "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify frontend responds over HTTP
        shell: bash
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          : "${FRONTEND_URL:?Falta la variable FRONTEND_URL}"
          for attempt in {1..12}; do
            status="$(curl --silent --location --max-time 10 \
              --output /dev/null --write-out '%{http_code}' "$FRONTEND_URL")" || status=000
            if [[ "$status" == "200" ]]; then
              echo "El frontend respondió HTTP 200." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El frontend no respondió HTTP 200."
          exit 1