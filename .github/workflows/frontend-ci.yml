name: Frontend CI & Build Check

on:
  push:
    branches:
      - main
      - deploy-render
      - prep-entrega-final
  pull_request:
    branches:
      - main
      - deploy-render
      - development
  workflow_dispatch:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint codebase
        run: npx eslint .

      - name: Build frontend
        run: npm run build

      - name: Run automated tests
        run: npm test -- --run
        